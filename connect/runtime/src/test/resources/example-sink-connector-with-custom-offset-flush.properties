# Example demonstrating connector-level offset flush interval configuration

# Worker configuration (connect-distributed.properties or connect-standalone.properties)
# Global offset flush interval (default for all connectors)
offset.flush.interval.ms=60000

# Enable/disable connector-level overrides (default: true)
connector.offset.flush.interval.override.enable=true

# Standard worker configurations
key.converter=org.apache.kafka.connect.json.JsonConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
offset.storage.file.filename=/tmp/connect.offsets

# Connector configuration (example-sink-connector.json or .properties)
name=example-sink-connector
connector.class=org.apache.kafka.connect.file.FileStreamSinkConnector
tasks.max=1
topics=test-topic
file=/tmp/test.sink.txt

# Custom offset flush interval for this specific connector (10 seconds)
# This overrides the worker-level offset.flush.interval.ms configuration
# Only works if connector.offset.flush.interval.override.enable=true in worker config
offset.flush.interval.ms=10000

# Other connector configurations
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.storage.StringConverter
